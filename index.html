<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Riot Studios</title>
<style>
:root{--bg:#f7f8fc;--fg:#1b1f2a;--muted:#5a6275;--card:#fff;--line:#d9deea;--accent:#0b7fa8;--gold:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#070a1a;--fg:#e8eeff;--muted:#a3adc6;--card:#10152b;--line:#253055;--accent:#5ff4ff;--gold:#ffb52e}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,Roboto,"Segoe UI",Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-left)) 60px}
h1{font-size:32px;margin:0 0 4px;letter-spacing:.02em}.sub{color:var(--muted);margin:0 0 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h2{margin:0 0 4px;font-size:22px}.card h2 b{color:var(--accent)}.card h2 i{font-style:normal;color:var(--gold)}
.card p{margin:4px 0 12px;color:var(--muted)}
a{color:var(--accent)}.links{display:flex;gap:16px;flex-wrap:wrap}
footer{margin-top:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Pixel Riot Studios</h1>
<p class="sub">Small studio, loud games.</p>
<div class="card">
<h2><b>SINE</b> <i>WARP</i></h2>
<p>An arcade space shooter with 10 worlds, giant bosses and an original soundtrack. Coming soon on Android.</p>
<div class="links"><a href="privacy-policy.html">Privacy policy</a><a href="privacy-policy.html#nl">Privacybeleid</a></div>
</div>
<footer>Contact: M.stumpel@gmail.com</footer>
</main>
</body>
</html>
